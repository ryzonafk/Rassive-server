# Fly.io config. A GROWN-UP runs `fly launch --no-deploy` once (it may rename the app), then `fly deploy`.
app = "rassive-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # sleeps when nobody is playing (saves money)
  auto_start_machines = true    # wakes up when someone connects
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
